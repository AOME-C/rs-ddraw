; rs-ddraw 配置文件
; 所有设置位于 [ddraw] 小节。修改后需重启游戏生效。
; 取值说明：开关型使用 Yes/No（或 True/False、1/0）；数值型为整数。

[ddraw]

; 渲染后端：auto（自动，优先 OpenGL 失败回退 GDI）/ opengl / gdi
Renderer = auto

; 是否保持游戏原始宽高比（黑边填充而非拉伸变形）
MaintainAspectRatio = No

; 窗口化时在窗口内留边框（window boxing）
Windowboxing = No

; 全屏时拉伸画面铺满整个屏幕
StretchToFullscreen = No

; 自定义拉伸后的输出尺寸（0 = 使用当前分辨率）。仅当上述拉伸开关启用时有效
StretchToWidth = 0
StretchToHeight = 0

; 固定输出模式：default（原始）/ center（居中）/ stretch（拉伸铺满）
FixedOutput = stretch

; 在屏幕角落显示实时 FPS（0 = 关闭，1 = 开启）
DrawFPS = 0

; 目标帧率限制。0 = 不限制（内部默认 60FPS）；>0 则按该值限帧
TargetFPS = 0

; 垂直同步。Yes = 开启（swap_interval=1），No = 关闭
VSync = No

; 主表面直接作为纹理上传（OpenGL 路径，通常保持开启）
PrimarySurface2Tex = Yes

; 每次绘制后强制 glFinish，降低延迟但会增加 CPU 等待（一般关闭）
GlFinish = No

; 在 GPU 上做像素格式转换（开启性能更好，保持 Yes）
ConvertOnGPU = Yes

; 使用 GL fence/sync 进行帧同步（一般关闭）
GlFenceSync = No

; 将进程绑定到单个 CPU 核心，提升老游戏兼容性（Yes 推荐）
SingleProcAffinity = Yes

; 鼠标移出屏幕边缘后的锁定超时时间（毫秒）。0 = 默认行为
MonitorEdgeTimer = 0
